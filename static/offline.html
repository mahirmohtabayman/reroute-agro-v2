<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অফলাইন · Reroute Agro</title>
<meta name="theme-color" content="#173D32">
<style>
  @font-face{font-family:Kalpurush; src:url(/static/fonts/Kalpurush.woff2) format("woff2"); font-display:swap;}
  :root{--bg:#F7F8F2; --surface:#fff; --ink:#1C2922; --muted:#5E6C63; --brand:#173D32; --line:#E1E7DF;}
  @media (prefers-color-scheme:dark){ :root{--bg:#101A16; --surface:#192720; --ink:#F1F6F0; --muted:#B0C0B4; --brand:#52C98A; --line:#2A3B32;} }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
       font-family:Kalpurush, "Noto Sans Bengali", system-ui, sans-serif; line-height:1.6;}
  main{max-width:420px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; text-align:center;}
  h1{font-size:1.5rem; margin:12px 0 6px;}
  p{color:var(--muted); margin:6px 0;}
  button{margin-top:18px; font:inherit; font-size:1rem; padding:12px 22px; min-height:44px; border:0; border-radius:12px;
         background:var(--brand); color:#fff; cursor:pointer;}
  @media (prefers-color-scheme:dark){ button{color:#101A16;} }
  svg{width:56px; height:56px; color:var(--brand);}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
  <h1>এখন ইন্টারনেট সংযোগ নেই</h1>
  <p>সংযোগ ফিরলে আবার চেষ্টা করুন। অফলাইনে অফার, পেমেন্ট বা বুকিং করা যায় না, তাই কোনো লেনদেন আধাআধি হয়ে থাকবে না।</p>
  <p lang="en">You are offline. Offers, payments and bookings need a connection.</p>
  <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
</main>
</body>
</html>
