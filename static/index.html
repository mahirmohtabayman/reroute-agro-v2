<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reroute Agro | কৃষক ও পাইকারের পাইকারি বাজার</title>
<meta name="description" content="কৃষক ও পাইকারের সরাসরি পাইকারি বাজার: দরদাম, নিরাপদ পেমেন্ট, নিজস্ব ট্রাক, মজুদ ও লাভ-ক্ষতির হিসাব">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --surface2:#EAEFE6; --ink:#15271D; --muted:#5E6E63; --line:#DCE3D7;
  --green:#1E8A4C; --green-soft:#DDF1E4; --red:#D93D27; --red-soft:#FCE5E0; --gold:#B98200; --gold-soft:#FFF2CC;
  --blue:#245C9E; --blue-soft:#E2ECF8; --shadow:0 1px 2px rgba(21,39,29,.06),0 8px 22px -16px rgba(21,39,29,.4);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#18221C; --surface2:#223128; --ink:#E5EEE7; --muted:#9DB0A3; --line:#2D3C33;
  --green:#3DAA6A; --green-soft:#1C3527; --red:#F2593F; --red-soft:#3A1F1A; --gold:#F0BE2E; --gold-soft:#3A3116;
  --blue:#6FA6E8; --blue-soft:#1B2B3F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -16px rgba(0,0,0,.8); } }
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#18221C; --surface2:#223128; --ink:#E5EEE7; --muted:#9DB0A3; --line:#2D3C33;
  --green:#3DAA6A; --green-soft:#1C3527; --red:#F2593F; --red-soft:#3A1F1A; --gold:#F0BE2E; --gold-soft:#3A3116;
  --blue:#6FA6E8; --blue-soft:#1B2B3F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -16px rgba(0,0,0,.8); }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kalpurush","Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla","Vrinda",system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{line-height:1.25;margin:0}
h1{font-size:1.55rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding-left:18px;padding-right:18px}
.muted{color:var(--muted)} .sm{font-size:.87rem} .xs{font-size:.78rem}
.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center} .row.wrap-it{flex-wrap:wrap} .grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
 
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn-green{background:var(--green);color:#fff} .btn-red{background:var(--red);color:#fff} .btn-blue{background:var(--blue);color:#fff}
.btn-ink{background:var(--ink);color:var(--surface)} .btn-soft{background:var(--surface2);color:var(--ink)}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:.88rem} .btn-wide{width:100%;padding:13px;font-size:1.05rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-red{background:var(--red-soft);color:var(--red)}
.p-gold{background:var(--gold-soft);color:var(--gold)} .p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted)}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.panel+.panel{margin-top:14px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.note{background:var(--blue-soft);border-radius:12px;padding:10px 14px;font-size:.93rem}
.warn{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.93rem}
.danger{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;font-size:.93rem;font-weight:600}
.good{background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 14px;font-size:.93rem;font-weight:600}
.demo-tag{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
 
/* header & nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;min-height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.12rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-user{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600}
.role{border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;color:#fff}
.role.farmer{background:var(--green)} .role.paikar{background:var(--blue)} .role.admin{background:var(--ink)}
.iconbtn{position:relative;border:0;background:var(--surface2);width:40px;height:40px;border-radius:50%;font-size:1.05rem;display:grid;place-items:center}
.iconbtn b{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center;padding:0 4px}
.npanel{position:absolute;right:18px;top:58px;width:min(380px,calc(100vw - 24px));background:var(--surface);border-radius:14px;box-shadow:0 20px 40px -10px rgba(0,0,0,.35);border:1px solid var(--line);display:none;max-height:72vh;overflow:auto;z-index:40}
.npanel.on{display:block}
.npanel .n{padding:11px 14px;border-top:1px solid var(--line);font-size:.92rem;cursor:pointer}
.npanel .n:hover{background:var(--surface2)}
.npanel .n.unread{border-left:4px solid var(--green)}
.tnav{background:var(--surface);border-bottom:1px solid var(--line)}
.tnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tnav a{padding:10px 12px;text-decoration:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.tnav a.on{color:var(--ink);border-color:var(--green)}
.cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:.72rem;margin-left:4px}
.bnav{display:none}
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:55;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .2s;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:54;display:none}
.scrim.on{display:block}
.sheet a{display:flex;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
main{padding:20px 0 70px;min-height:72vh}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
 
/* minimal home */
.hero{min-height:calc(100vh - 200px);display:grid;place-items:center;text-align:center;padding:30px 0}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.01em}
.hero p.lead{font-size:1.15rem;color:var(--muted);margin:14px auto 0;max-width:30em}
.hero .cta{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.hero .cta .btn{padding:15px 26px;font-size:1.08rem;border-radius:14px;min-width:190px}
.hero .feat{display:flex;gap:18px;justify-content:center;margin-top:34px;flex-wrap:wrap;color:var(--muted);font-weight:600}
.hero .feat span{display:flex;gap:6px;align-items:center}
.hero .logo-big{font-size:3.4rem;line-height:1;margin-bottom:12px}
 
/* forms */
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:.88rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field textarea{min-height:70px}
.choice{display:grid;gap:8px}
.choice.c2{grid-template-columns:1fr 1fr} .choice.c3{grid-template-columns:1fr 1fr 1fr} .choice.c4{grid-template-columns:repeat(4,1fr)}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.opt strong{display:block} .opt .muted{font-size:.82rem}
.cropbtn{text-align:center} .cropbtn b{display:block;font-size:1.8rem;line-height:1.2}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:0;background:var(--surface2);font-size:1.6rem;font-weight:700;flex:none}
.stepper input{flex:1;text-align:center;font-size:1.3rem;font-weight:700;border:1.5px solid var(--line);border-radius:10px;padding:8px;min-width:0;background:var(--surface)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.thumbs button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem}
 
/* cards & listings */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lcard{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.lcard:hover{box-shadow:0 0 0 2px var(--green),var(--shadow)}
.pic{position:relative;height:140px;background:var(--c,#eee);display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .emo{font-size:3.3rem}
.pic .nophoto{position:absolute;bottom:6px;right:6px;background:rgba(255,255,255,.85);color:#444;font-size:.68rem;border-radius:6px;padding:0 6px}
.rib{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:.76rem;font-weight:700;border-radius:6px;padding:2px 8px}
.rib.r2{left:auto;right:8px;background:var(--ink)}
.fresh{position:absolute;bottom:8px;left:8px;background:var(--surface);font-size:.76rem;font-weight:700;border-radius:999px;padding:1px 9px}
.fresh.ok{color:var(--green)} .fresh.mid{color:var(--gold)} .fresh.low{color:var(--red)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.price{font-size:1.25rem;font-weight:700}
.price small{font-size:.8rem;color:var(--muted);font-weight:500}
.price s{font-size:.82rem;color:var(--muted);font-weight:500;margin-left:4px}
.tline{margin-top:6px;font-size:.8rem;background:var(--green-soft);color:var(--green);border-radius:8px;padding:4px 8px;font-weight:600}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;flex:none;background:var(--c,#eee)}
.ico.sm{width:34px;height:34px;font-size:1.2rem;border-radius:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pic,:root:not([data-theme="light"]) .ico{background:color-mix(in srgb,var(--c) 16%,var(--surface2))}}
:root[data-theme="dark"] .pic,:root[data-theme="dark"] .ico{background:color-mix(in srgb,var(--c) 16%,var(--surface2))}
.av{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:1.3rem;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:76px;height:76px;font-size:2.2rem}
.ver{color:var(--blue);font-weight:700;font-size:.82rem;white-space:nowrap}
.stars{color:var(--gold);font-weight:700;white-space:nowrap}
.ulink{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:10px}
.filters label{display:block} .filters span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.filters input,.filters select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
 
/* lists, rows, tables */
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.93rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}
.bill{font-size:.94rem}
.bill div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.bill .minus b{color:var(--red)} .bill .plus b{color:var(--green)}
.bill .tot{border-top:1.5px solid var(--line);margin-top:4px;padding-top:7px;font-size:1.08rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:.8rem;padding:8px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface2)}
.num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.kpi{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;text-decoration:none;color:var(--ink);display:block}
.kpi strong{display:block;font-size:1.4rem;line-height:1.25}
.kpi.hl{outline:2px solid var(--red)}
.todo{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;border-left:5px solid var(--red);margin-bottom:10px;text-decoration:none;color:var(--ink)}
.todo .ic{font-size:1.5rem}
.alert{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:600;font-size:.93rem}
.alert.spoil{background:var(--red-soft);color:var(--red)} .alert.low{background:var(--gold-soft);color:var(--gold)}
 
/* trackers */
.track{display:flex;margin:12px 0 4px}
.track .st{flex:1;text-align:center;font-size:.74rem;color:var(--muted);position:relative;padding:0 2px}
.track .st i{display:block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.track .st::before{content:"";position:absolute;top:7px;right:50%;width:100%;height:3px;background:var(--line)}
.track .st:first-child::before{display:none}
.track .st.done i,.track .st.done::before{background:var(--green)}
.track .st.now{color:var(--ink);font-weight:700}
.track .st.now i{box-shadow:0 0 0 4px var(--green-soft)}
.track.bad .st.done i,.track.bad .st.done::before{background:var(--muted)}
.timeline{border-left:3px solid var(--line);margin:6px 0 0 8px;padding-left:14px}
.timeline>div{position:relative;padding:4px 0 10px;font-size:.92rem}
.timeline>div::before{content:"";position:absolute;left:-21px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--green)}
.bars .r{display:grid;grid-template-columns:120px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.bars i{display:block;height:13px;border-radius:7px;background:var(--gold)}
.bars i.best{background:var(--green)} .bars i.base{background:var(--muted)}
.bars b{text-align:right}
 
/* modal, toast, banners */
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.overlay.on{display:flex}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:500px;max-height:92vh;overflow:auto;position:relative}
.modal .body{padding:20px}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-size:1rem;z-index:2}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--green-soft);border-left:5px solid var(--green);font-size:.93rem;font-weight:600}
.banner.cancel{background:var(--red-soft);border-left-color:var(--red)} .banner.pay{background:var(--gold-soft);border-left-color:var(--gold)}
.banner .x2{border:0;background:transparent;color:var(--muted);font-size:1rem}
.gateway{border-radius:14px;padding:16px;color:#fff;margin-bottom:12px}
.gateway.bkash{background:#D12053} .gateway.nagad{background:#EC1C24} .gateway.card{background:#1F3B6E} .gateway.wallet{background:var(--green)}
.big-ic{font-size:3rem;text-align:center}
footer{border-top:1px solid var(--line);padding:16px 0 26px;color:var(--muted);font-size:.86rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
 
@media (max-width:900px){
  .grid2,.grid3{grid-template-columns:1fr} .grid4{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:1fr 1fr}
  .filters .q{grid-column:1/-1}
  .tnav{display:none}
  .sheet{display:block;visibility:hidden} .sheet.on{visibility:visible}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a,.bnav button{flex:1;text-align:center;text-decoration:none;font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 2px;position:relative;border:0;background:none}
  .bnav b{display:block;font-size:1.3rem;line-height:1.2}
  .bnav .on{color:var(--green)}
  .bnav .cnt{position:absolute;top:0;left:56%}
  body.authed main{padding-bottom:110px}
  body.authed footer{padding-bottom:100px}
  .chip-user .nm{display:none}
  .lgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pic{height:110px} .pic .emo{font-size:2.6rem}
  .price{font-size:1.08rem}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:20px 20px 0 0;max-height:94vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bars .r{grid-template-columns:90px 1fr 80px}
  .hide-m{display:none}
}
@media (max-width:420px){ .logo .full{display:none} .choice.c4{grid-template-columns:repeat(2,1fr)} .hero .cta .btn{width:100%} }

/* ---------- pricing mirrors of the server (same formulas) ---------- */
function km(a,b){ if(a===b) return 15; const A=PLACES[a],B=PLACES[b],R=6371,dl=(B.lat-A.lat)*Math.PI/180,dn=(B.lon-A.lon)*Math.PI/180;
  const h=Math.sin(dl/2)**2+Math.cos(A.lat*Math.PI/180)*Math.cos(B.lat*Math.PI/180)*Math.sin(dn/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))*1.35); }
function quote(src,dst,kg,plus,bulk){

/* ---------- photo helper: shrink before upload ---------- */
function shrinkImage(file, max=900){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.72)); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}

function todoCount(){
  if(!isTrader()) return 0; const id=S.me.id;
  return (S.offers||[]).filter(o=>['pending','countered'].includes(o.status)&&((o.waiting==='seller'&&o.seller===id)||(o.waiting==='buyer'&&o.buyer===id))).length
    + (S.orders||[]).filter(o=>(o.status==='awaiting_payment'&&o.buyer===id)||(o.status==='handed_over'&&o.buyer===id)||(o.status==='confirmed'&&o.seller===id&&o.transport==='self')).length
    + (S.inspections||[]).filter(i=>i.status==='requested'&&i.seller===id).length;
}
function renderChrome(){
  const u=me(), r=routeBase();
  document.body.classList.toggle('authed',!!u);
  if(!u){
    $('#hrow').innerHTML = LOGO+`<div class="hright"><a class="btn btn-soft btn-sm" href="#/market">বাজার</a><a class="btn btn-green btn-sm" href="#/login">লগ ইন</a></div>`;
    $('#tnav').innerHTML=''; $('#bnav').innerHTML=''; return;
  }
  const unread=(S.notifs||[]).filter(n=>!n.read).length, todo=todoCount();
  $('#hrow').innerHTML = LOGO+`<div class="hright">
    <a class="chip-user" href="${u.role==='admin'?'#/admin':'#/account'}">${avatar(u)}<span class="nm">${esc(dispName(u))}</span><span class="role ${u.role}">${roleBn(u.role)}</span></a>
    <button class="iconbtn" data-act="bell" aria-label="নোটিফিকেশন">🔔${unread?`<b>${nf(unread)}</b>`:''}</button>
    <button class="btn btn-line btn-sm hide-m" data-act="logout">বের হন</button></div>`;
  const nav = u.role==='admin'?NAV_ADMIN:NAV_TRADER;
  $('#tnav').innerHTML = `<div class="wrap">${nav.map(([h,i,t])=>`<a href="${h}" class="${r===h?'on':''}">${i} ${t}${h==='#/deals'&&todo?`<span class="cnt">${nf(todo)}</span>`:''}</a>`).join('')}</div>`;
  const bn = u.role==='admin'?NAV_ADMIN.slice(0,4):BNAV_TRADER;
  $('#bnav').innerHTML = bn.map(([h,i,t])=>`<a href="${h}" class="${r===h?'on':''}"><b>${i}</b>${t}${h==='#/deals'&&todo?`<span class="cnt">${nf(todo)}</span>`:''}</a>`).join('')
    + `<button data-act="sheet"><b>☰</b>আরও</button>`;
  $('#sheet').innerHTML = `<div class="between" style="padding:0 6px 6px"><b>মেনু</b><button class="iconbtn" data-act="sheet" aria-label="মেনু বন্ধ">✕</button></div>` + nav.map(([h,i,t])=>`<a href="${h}" data-act="nav" data-to="${h}"><span>${i}</span>${t}</a>`).join('')+`<a href="#/" data-act="logout"><span>🚪</span>বের হন</a>`;
}
function renderBell(){
  const list=(S.notifs||[]).slice(0,25);

}
const KIND_BANNER = {offer:'',pay:'pay',cancel:'cancel',order:'',transport:'',done:'',inspection:'',spoil:'cancel',stock:'pay',urgent:'pay'};
function banners(){
  const list=(S.notifs||[]).filter(n=>!n.read && n.kind in KIND_BANNER).slice(0,2);
  return list.map(n=>`<div class="banner ${KIND_BANNER[n.kind]}"><div class="grow">${esc(n.text)}</div>
    ${n.link?`<button class="btn btn-sm btn-ink" data-act="notif" data-id="${n.id}" data-link="${n.link}">দেখুন</button>`:''}
    <button class="x2" data-act="notif-x" data-id="${n.id}" aria-label="সরান">✕</button></div>`).join('');
}

const F = {q:'',crop:'all',place:'all',max:'',min:'',seller:'all',sold:false,sort:'new'};
function listingPic(l){
  const c=CROPS[l.crop];
  return `<div class="pic" style="--c:${c.c}">${l.photo_count?`<img src="/api/listings/${l.id}/photo/0" alt="${c.n}" loading="lazy">`:`<span class="emo">${c.i}</span><span class="nophoto">ছবি দেওয়া হয়নি</span>`}
    ${l.urgent?`<span class="rib">জরুরি −${nf(l.urgent*100)}%</span>`:''}${l.status==='sold_out'?'<span class="rib r2">বিক্রি শেষ</span>':''}
    <span class="fresh ${freshCls(l.days_left)}">⏳ ${freshTxt(l.days_left)}</span></div>`;
}
function transportHint(l){
  const u=me(); if(!u||u.role==='admin'||u.id===l.uid) return '';
  const s=user(l.uid), q=myQuote(s.place,u.place,Math.max(l.moq,Math.min(l.available,2000)));
  return `<div class="tline">🚚 ${PLACES[u.place].n} পর্যন্ত Reroute ট্রাকে আনুমানিক ${tk(q.total)} (${monTxt(Math.max(l.moq,Math.min(l.available,2000)))}), বাজারে ট্রাক ভাড়া ${tk(q.offline)}</div>`;
}
function lcard(l){
  const c=CROPS[l.crop], s=user(l.uid);
  return `<a class="lcard" href="#/listing/${l.id}">${listingPic(l)}<div class="info">
    <div class="between"><b>${c.n}</b><span class="pill p-grey">গ্রেড ${l.grade}</span></div>
    <div class="price">${tk(l.eff_price,1)}<small>/কেজি</small>${l.urgent?`<s>${tk(l.price,1)}</s>`:''}</div>
    <div class="muted sm">আছে ${monTxt(l.available)} · সর্বনিম্ন ${monTxt(l.moq)}</div>
    <div class="sm">${s.role==='paikar'?'🏪':'🧑‍🌾'} ${esc(dispName(s))} ${s.verified?'<span class="ver">✔</span>':''} ${stars(s)}</div>
    <div class="muted sm">📍 ${s.area?esc(s.area)+', ':''}${PLACES[s.place].n}</div>
    ${transportHint(l)}</div></a>`;
}
V.market = () => {
  let list=(S.listings||[]).filter(l=>l.status==='active'||(F.sold&&l.status==='sold_out'));
  list=list.filter(l=>{ const s=user(l.uid), c=CROPS[l.crop];
    if(F.crop!=='all'&&l.crop!==F.crop) return false;
    if(F.place!=='all'&&s.place!==F.place) return false;
    if(F.max&&l.eff_price>+F.max) return false;
    if(F.min&&l.available<+F.min*MON) return false;
    if(F.seller!=='all'&&s.role!==F.seller) return false;
    if(F.q&&!(c.n+dispName(s)+PLACES[s.place].n+(s.area||'')+(l.quality||'')).includes(F.q)) return false;
    return true; });
  const sorters={new:(a,b)=>b.created-a.created, cheap:(a,b)=>a.eff_price-b.eff_price, fresh:(a,b)=>b.days_left-a.days_left,
    near:(a,b)=>me()?km(user(a.uid).place,me().place)-km(user(b.uid).place,me().place):0, big:(a,b)=>b.available-a.available};
  list.sort(sorters[F.sort]);
  return `<div class="phead"><div><h1>🛒 বাজার</h1><p class="muted sm">কৃষক ও পাইকারদের তোলা সব মাল। শুধু পাইকারি: সর্বনিম্ন অর্ডার ${monTxt(S.config.min_order)}</p></div>
    ${isTrader()?`<a class="btn btn-green" href="#/listings/new">+ মাল বিক্রির জন্য দিন</a>`:(!me()?`<a class="btn btn-green" href="#/login">কিনতে বা বেচতে লগ ইন</a>`:'')}</div>
    <div class="filters">
      <label class="q"><span>খুঁজুন</span><input data-f="q" value="${esc(F.q)}" placeholder="ফসল, বিক্রেতা, এলাকা..."></label>
      <label><span>জেলা</span><select data-f="place"><option value="all">সব জেলা</option>${Object.entries(PLACES).map(([k,p])=>`<option value="${k}" ${F.place===k?'selected':''}>${p.n}</option>`).join('')}</select></label>
      <label><span>সর্বোচ্চ দাম (৳/কেজি)</span><input data-f="max" type="number" min="0" value="${F.max}"></label>
      <label><span>অন্তত কত মণ</span><input data-f="min" type="number" min="0" value="${F.min}"></label>
      <label><span>বিক্রেতা</span><select data-f="seller">${[['all','সবাই'],['farmer','কৃষক'],['paikar','পাইকার']].map(([k,t])=>`<option value="${k}" ${F.seller===k?'selected':''}>${t}</option>`).join('')}</select></label>
      <label><span>সাজান</span><select data-f="sort">${[['new','নতুন আগে'],['cheap','কম দাম আগে'],['fresh','বেশি তাজা আগে'],['near','কাছের আগে'],['big','বেশি পরিমাণ আগে']].map(([k,t])=>`<option value="${k}" ${F.sort===k?'selected':''}>${t}</option>`).join('')}</select></label>
    </div>
    <div class="chips">${[['all','সব ফসল'],...Object.entries(CROPS).map(([k,c])=>[k,c.i+' '+c.n])].map(([k,t])=>`<button class="chip ${F.crop===k?'on':''}" data-act="f-crop" data-v="${k}">${t}</button>`).join('')}

    <p class="muted sm" style="margin-bottom:8px">${nf(list.length)}টি লিস্টিং</p>
    <div class="lgrid">${list.map(lcard).join('')||'<div class="empty" style="grid-column:1/-1">এই খোঁজে কিছু পাওয়া যায়নি। ফিল্টার বদলান।</div>'}</div>`;
};

      <div class="scroll">${g}</div><p class="muted sm">কালো: আসল দাম · সবুজ ডটেড: মডেলের পূর্বাভাস (যাচাই) · লাল: পরের মাস</p></div>

const EV_BN = {offer:'অফার দিয়েছেন',counter:'পাল্টা দাম দিয়েছেন',accept:'রাজি হয়েছেন',reject:'রাজি হননি',cancel:'অফার তুলে নিয়েছেন',expire:'মেয়াদ শেষ'};
function sellerPayout(o, price){
  const u=me(), kg=o.qty, goods=price*kg, fee=platformFee(goods), feeDisc=Math.min(u.fee_credit||0,fee);
  let share=0, credit=0, q=null;
  if(o.transport==='reroute'){ q=quote(u.place,user(o.buyer).place,kg,false,false); share={buyer:0,half:q.total/2,seller:q.total}[o.split]; credit=Math.min(u.transport_credit||0,share*.5); }
  return {goods,fee,feeDisc,share,credit,payout:goods-fee+feeDisc-share+credit,q};
}
function buyerTotal(o, price){
  const u=me(), s=user(o.seller), kg=o.qty, goods=price*kg; let share=0, credit=0, q=null;
  if(o.transport==='reroute'){ q=myQuote(s.place,u.place,kg); share={buyer:q.total,half:q.total/2,seller:0}[o.split]; credit=Math.min(u.transport_credit||0,share*.5); }
  return {goods,share,credit,total:goods+share-credit,q};
}

function parts(){ return (location.hash||'#/').split('?')[0].replace(/^#\/?/,'').split('/'); }

let AFTER_NAV=null;
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function go(h, then){ if(location.hash===h){ render(); if(then) then(); } else { AFTER_NAV=then||null; location.hash=h; } }
function render(){
  const p=parts(), u=me(); let html='';
  const needT=()=>{ if(!u){ go('#/login'); return false; } if(u.role==='admin'){ go('#/admin'); return false; } return true; };
  const needA=()=>{ if(!u||u.role!=='admin'){ go(u?'#/home':'#/login'); return false; } return true; };
  switch(p[0]){
    case '': if(u){ go(u.role==='admin'?'#/admin':'#/home'); return; } html=V.home(); break;
    case 'login': html=V.login(); break;
    case 'register': html=V.register(); break;
    case 'market': html=V.market(); break;
    case 'listing': html=V.listing(p[1]); break;
    case 'u': html=V.profile(p[1]); break;
    case 'ai': html=V.ai(); break;
    case 'transport': if(u&&u.role==='admin'){ go('#/admin/bookings'); return; } html=V.transport(); break;
    case 'home': if(!needT()) return; html=V.dash(); break;
    case 'listings': if(!needT()) return; html=p[1]==='new'?V.newListing():V.listings(); break;
    case 'deals': if(!needT()) return; html=V.deals(); break;
    case 'offer': if(!needT()) return; html=V.offer(p[1]); break;
    case 'order': if(!needT()) return; html=V.order(p[1]); break;
    case 'inspection': if(!needT()) return; html=V.inspection(p[1]); break;
    case 'booking': if(!needT()) return; html=V.booking(p[1]); break;
    case 'books': if(!needT()) return; html=V.books(); break;
    case 'prices': if(!needT()) return; html=V.prices(); break;
    case 'rewards': if(!needT()) return; html=V.rewards(); break;
    case 'account': if(!needT()) return; html=V.account(); break;
    case 'admin': if(!needA()) return; html=({'':V.admin,bookings:V.adminBookings,trucks:V.adminTrucks,users:V.adminUsers,orders:V.adminOrders}[p[1]||'']||V.admin)(); break;
    default: html=`<div class="empty">পাতা পাওয়া যায়নি। <a href="#/">শুরুতে ফিরুন</a></div>`;
  }
  if(u){ const here=location.hash; (S.notifs||[]).filter(n=>!n.read&&n.link===here).forEach(n=>{ n.read=1; api(`/notifs/${n.id}/read`,'POST').catch(()=>{}); }); }
  if(u && !['login','register'].includes(p[0])) html=banners()+html;
  $('#view').innerHTML=html; renderChrome();
}
function renderKeepFocus(){
  const a=document.activeElement, key=a&&[...a.attributes].find(x=>x.name.startsWith('data-')&&x.name!=='data-act');
  const sel=a&&a.selectionStart; render();
  if(key){ const el=document.querySelector(`[${key.name}="${key.value}"]`); if(el){ el.focus(); try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}

    await api('/admin/trucks','POST',TK); TK={company:'Reroute ট্রাক ',driver:'',phone:'',number:'',vehicle:'mini',place:'rajshahi',areas:''}; await refresh(); toast('🛻 ট্রাক যোগ হয়েছে'); },
  'at-status':async d=>{ if(!await confirmBox({title:d.v==='maintenance'?'ট্রাক মেরামতে পাঠাবেন?':'ট্রাক আবার চালু করবেন?'})) return; await api(`/admin/trucks/${d.id}`,'PATCH',{status:d.v}); await refresh(); },
  'au-verify':async d=>{ if(!await confirmBox({title:'প্রোফাইল যাচাই করবেন?',body:'কাগজপত্র (NID / ট্রেড লাইসেন্স) দেখে নিশ্চিত হলে যাচাই করুন। ব্যবহারকারী +৫০ পয়েন্ট পাবেন।'})) return; await api(`/admin/users/${d.id}/verify`,'POST'); await refresh(); }
};
let RT=null;
function drawRate(){
  const o=S.orders.find(x=>x.id===RT.id), other=user(o.seller===me().id?o.buyer:o.seller);
  modal(`<div class="body" style="text-align:center"><h2>${esc(dispName(other))}-কে রেটিং দিন</h2><p class="muted">${monTxt(o.qty)} ${CROPS[o.crop].n}</p>
    <div style="font-size:2.4rem;margin:12px 0">${[1,2,3,4,5].map(i=>`<button data-act="rate-star" data-v="${i}" style="border:0;background:none;font-size:2.4rem;color:${i<=RT.stars?'var(--gold)':'var(--line)'}" aria-label="${bd(i)} তারা">★</button>`).join('')}</div>
    <input id="rt-text" maxlength="120" placeholder="ছোট মন্তব্য (ঐচ্ছিক)" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)">
    <button class="btn btn-green btn-wide" style="margin-top:12px" data-act="rate-send">রেটিং দিন</button></div>`);
}
 
/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ if(!e.target.closest('#npanel')&&!e.target.closest('[data-act="bell"]')) $('#npanel').classList.remove('on');
    if(e.target.id==='overlay') closeModal(); if(!e.target.closest('#sheet')) closeSheet(); return; }
  const fn=A[el.dataset.act]; if(!fn) return;
  e.preventDefault();
  if(el.dataset.busy) return; el.dataset.busy='1';
  Promise.resolve(fn(el.dataset,el)).catch(()=>{}).finally(()=>{ delete el.dataset.busy; });
});
document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset, v=t.type==='checkbox'?t.checked:t.value, num=x=>x===''?'':+x;
  if(d.f!==undefined){ F[d.f]=v; renderKeepFocus(); return; }
  if(d.nl!==undefined){ NL[d.nl]=['mon','price','moq','harvest'].includes(d.nl)?num(v):v; const s=$('#nl-sum'); if(s) s.innerHTML=nlSummary(); return; }
  if(d.of!==undefined){ OF[d.of]=d.of==='note'?v:num(v); const b=$('#of-bill'); if(b) b.innerHTML=offerBill(offerCalc()); return; }
  if(d.bk!==undefined){ BK[d.bk]=d.bk==='mon'?num(v):v; const b=$('#bk-bill'); if(b) b.innerHTML=bkBill(); return; }
  if(d.hf!==undefined){ HF[d.hf]=v; renderKeepFocus(); return; }
  if(d.cl!==undefined){ CL[d.cl]=['mon','price','other'].includes(d.cl)?num(v):v; const tmp=document.createElement('div'); tmp.innerHTML=calcView(); $('#calc-out').innerHTML=tmp.querySelector('#calc-out').innerHTML; return; }
  if(d.en!==undefined){ EN[d.en]=v; return; }
  if(d.pr!==undefined){ PR[d.pr]=v===''?'':+v; renderKeepFocus(); return; }
  if(d.ac!==undefined){ AC[d.ac]=v; return; }
  if(d.tk!==undefined){ TK[d.tk]=v; return; }
  if(d.ai!==undefined){ AIS[d.ai]=v; render(); return; }
});
document.addEventListener('change',async e=>{
  const t=e.target, a=t.dataset.actChange;
  if(t.dataset.f==='sold'){ F.sold=t.checked; render(); return; }
  if(a==='nl-photo'){ const files=[...t.files].slice(0,3-NL.photos.length); for(const f of files){ try{ NL.photos.push(await shrinkImage(f)); }catch(err){ toast('ছবি পড়া যায়নি'); } } render(); }
  if(a==='ac-photo'&&t.files[0]){ try{ AC.photo=await shrinkImage(t.files[0],400); render(); }catch(err){ toast('ছবি পড়া যায়নি'); } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('#npanel').classList.remove('on'); closeSheet(); } });
 
/* every 5 s: new offers / payments / truck updates from other phones show up here */
setInterval(async()=>{
  if(document.hidden) return;
  try{ const r=await load(); if(!r.changed) return;
    const a=document.activeElement, typing=a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName), modalOpen=$('#overlay').classList.contains('on');
    if(typing||modalOpen) renderChrome(); else render();
    if(r.fresh.length) toast('🔔 '+r.fresh[0].text.slice(0,80)+(r.fresh[0].text.length>80?'…':''));
  }catch(e){}
},5000);
 
(async function init(){
  $('#view').innerHTML='<div class="empty">লোড হচ্ছে...</div>';
  try{ await load(); }catch(e){ $('#view').innerHTML='<div class="empty">সার্ভার চালু হচ্ছে, কয়েক সেকেন্ড পরে পাতাটি রিফ্রেশ করুন।</div>'; return; }
  try{ speechSynthesis.getVoices(); }catch(e){}
  render();
})();
</script>
