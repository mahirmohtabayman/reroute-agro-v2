let CL=null;


function calcView(){

  const u=me(),
        inv=(S.inventory||[])
          .find(r=>r.cost!=null);

  if(!CL){

    CL={
      crop:inv?inv.crop:'tomato',
      mon:25,
      price:MARKET_DEMO.dhaka[
        inv?inv.crop:'tomato'
      ],
      cost:inv
        ?Math.round(inv.cost)
        :'',
      to:'dhaka',
      split:'half',
      other:0
    };
  }

  const kg=CL.mon*MON,
        rev=CL.price*kg,
        fee=
          u.role==='paikar'
          ||
          u.role==='farmer'
          ?platformFee(rev)
          :0,

        q=quote(
          u.place,
          CL.to,
          kg,
          false,
          false
        ),

        tr=
          CL.split==='none'
          ?0
          :CL.split==='half'
          ?q.total/2
          :q.total,

        cost=
          CL.cost===''
          ?null
          :+CL.cost*kg,

        other=+CL.other||0,

        profit=
          rev
          -fee
          -tr
          -other
          -(cost||0);

  return `
    <div
      class="grid4"
      style="gap:10px">

      <label class="field">

        <span>
          ফসল
        </span>

        <select data-cl="crop">

          ${
            Object.entries(CROPS)
            .map(([k,c])=>`
              <option
                value="${k}"
                ${CL.crop===k?'selected':''}>
                ${c.n}
              </option>
            `)
            .join('')
          }

        </select>

      </label>

      <label class="field">

        <span>
          কত মণ
        </span>

        <input
          data-cl="mon"
          type="number"
          min="5"
          value="${CL.mon}">

      </label>

      <label class="field">

        <span>
          বিক্রির দাম ৳/কেজি
        </span>

        <input
          data-cl="price"
          type="number"
          step="0.5"
          value="${CL.price}">

      </label>

      <label class="field">

        <span>
          ${
            u.role==='paikar'
            ?'কেনা'
            :'উৎপাদন'
          }
          খরচ ৳/কেজি
        </span>

        <input
          data-cl="cost"
          type="number"
          step="0.5"
          value="${CL.cost}"
          placeholder="জানা না থাকলে ফাঁকা">

      </label>

      <label class="field">

        <span>
          কোথায় পাঠাবেন
        </span>

        <select data-cl="to">

          ${
            Object.entries(PLACES)
            .map(([k,p])=>`
              <option
                value="${k}"
                ${CL.to===k?'selected':''}>
                ${p.n}
              </option>
            `)
            .join('')
          }

        </select>

      </label>

      <label class="field">

        <span>
          ট্রাক ভাড়া আপনার
        </span>

        <select data-cl="split">

          ${
            [
              ['half','অর্ধেক'],
              ['all','পুরো'],
              ['none','ক্রেতা দেবেন']
            ]
            .map(([k,t])=>`
              <option
                value="${k}"
                ${CL.split===k?'selected':''}>
                ${t}
              </option>
            `)
            .join('')
          }

        </select>

      </label>

      <label class="field">

        <span>
          অন্যান্য খরচ ৳
        </span>

        <input
          data-cl="other"
          type="number"
          min="0"
          value="${CL.other}">

      </label>

    </div>

    <div
      id="calc-out"
      style="margin-top:12px">

      ${
        bill([
          [
            'বিক্রি',
            tk(rev)
          ],

          cost!=null
          ?[
            'মালের খরচ',
            '−'+tk(cost),
            'minus'
          ]
          :null,

          [
            'ট্রাক ভাড়া (Reroute)',
            '−'+tk(tr),
            'minus'
          ],

          [
            'প্ল্যাটফর্ম ফি ১%',
            '−'+tk(fee),
            'minus'
          ],

          other
          ?[
            'অন্যান্য',
            '−'+tk(other),
            'minus'
          ]
          :null,

          [
            cost!=null
            ?'লাভ / ক্ষতি'
            :'খরচ বাদে হাতে থাকবে (মালের খরচ ছাড়া)',

            tk(profit),
            'tot'
          ]
        ])
      }

      ${
        cost==null
        ?`
        <p
          class="warn sm"
          style="margin-top:6px">
          মালের খরচ দিলে আসল লাভ দেখাবে।
        </p>
        `
        :''
      }

    </div>
  `;
}

function advOnPage(){
  const p = parts();
  return p[0] === 'advisor' || (p[0] === 'admin' && p[1] === 'ai');

async function advFetch(path){
  const r = await fetch('/api' + path, {headers: TOKEN ? {'X-Token': TOKEN} : {}});
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

/* cached GET: returns data, or null while loading (re-renders the page when the data arrives) */
function advGet(path, ttl = 600000){
  const c = ADV.cache[path];
  if (c && !c.error && Date.now() - c.at < ttl) return c.d;
  if (!ADV.busy[path]) {
    ADV.busy[path] = 1;
    advFetch(path)
      .then(d => { ADV.cache[path] = {d, at: Date.now()}; })
      .catch(() => {
        ADV.cache[path] = {error: true, at: Date.now()};
        setTimeout(() => { if (advOnPage()) render(); }, 6000);
      })
      .finally(() => { delete ADV.busy[path]; if (advOnPage()) render(); });
  }
  return c && !c.error ? c.d : null;
}

function advRole(){
  const u = me();
  if (u && u.role === 'paikar') return 'buyer';
  if (u && u.role === 'farmer') return 'farmer';
  return ADV.view || 'farmer';
}

function advPrefillCost(){
  if (ADV.costTouched) return;

function advDefaults(){
  const u = me();
  if (!ADV.place) ADV.place = u && PLACES[u.place] ? u.place : 'rajshahi';

/* =====================================================================
   Smart Trade Alert — runs before an offer / acceptance / counter / listing
   ===================================================================== */
const TA = {busy: false, pending: null};
const TA_ACTS = ['of-submit', 'o-accept', 'counter-send', 'nl-submit'];

function taPlan(act, d){
  const u = me();
  if (!u || u.role === 'admin') return null;
  const base = '/ai/advisor/trade-check?';
  if (act === 'of-submit') {
    if (typeof OF === 'undefined' || !OF) return null;
    const l = listing(OF.lid), kg = OF.mon * MON, price = +OF.price;
    if (!l || kg < l.moq || kg > l.available || !(price > 0 && price <= l.eff_price)) return null;  // the normal check shows the error
    return {path: `${base}mode=offer&listing=${l.id}&qty=${kg}&price=${price}&transport=${OF.transport}&split=${OF.split}`,
      verb: 'buy', run: () => A['of-submit'](), edit: () => drawOffer()};
  }
  if (act === 'o-accept') {
    const o = (S.offers || []).find(x => x.id === d.id);
    if (!o) return null;
    const sell = o.seller === u.id;
    return {path: `${base}mode=deal&offer=${o.id}`, verb: sell ? 'sell' : 'buy', run: () => A['o-accept']({id: o.id}),
      edit: sell && o.price < o.listed_price ? () => A['o-counter']({id: o.id}) : null};
  }
  if (act === 'counter-send') {
    const o = (S.offers || []).find(x => x.id === d.id), inp = $('#ct-price'), v = inp ? +inp.value : NaN;
    if (!o || !(v > o.price && v <= o.listed_price)) return null;
    const reopen = () => { A['o-counter']({id: o.id}); const i = $('#ct-price'); if (i) i.value = v; };
    return {path: `${base}mode=deal&offer=${o.id}&price=${v}`, verb: 'sell',
      run: () => { reopen(); return A['counter-send']({id: o.id}); }, edit: reopen};
  }
  if (act === 'nl-submit') {
    if (typeof NL === 'undefined' || !NL) return null;
    if (!(NL.mon >= 5 && NL.moq >= 5 && NL.moq <= NL.mon && NL.price > 0)) return null;
    const cost = NL.cost === '' || NL.cost == null ? null : +NL.cost;
    return {path: `${base}mode=listing&crop=${NL.crop}&qty=${NL.mon * MON}&price=${NL.price}${cost != null ? `&cost=${cost}` : ''}`,
      verb: 'list', run: () => A['nl-submit'](), edit: () => closeModal()};
  }
  return null;
}

function taRun(p){
  Promise.resolve().then(() => p.run()).catch(() => {});
}

function taDecide(p, r){
  if (!r) { taRun(p); return; }                                   // AI unavailable: never block the trade
  if (r.status === 'loss') { taModal(p, r); return; }
  if (r.status === 'unknown') {
    toast('নির্ভরযোগ্য লাভ-ক্ষতির হিসাবের জন্য উৎপাদন/কেনা খরচ দরকার। এখন হাতে থাকবে আনুমানিক ' + tk(r.in_hand),'warning');
  } else if (r.side === 'buyer') {
    toast(r.risk_range ? `আনুমানিক লাভ ${tk(r.net)}, তবে দাম কমলে লোকসানের ঝুঁকি আছে` : `আনুমানিক লাভজনক: প্রায় ${tk(r.net)} লাভ`, r.risk_range ? 'warning' : 'success');
  } else {
    toast(`আনুমানিক লাভজনক: খরচ বাদে প্রায় ${tk(r.profit)} লাভ`);
  }
  taRun(p);
}

function taModal(p, r){
  TA.pending = p;
  const buy = r.side === 'buyer', loss = Math.abs(buy ? r.net : r.profit);
  const verb = {buy: 'এই দামে কিনলে', sell: 'এই দামে বিক্রি করলে', list: 'এই দামে সব বিক্রি হলে'}[p.verb];
  let rows;
  const reasons = [], tips = [];
  if (buy) {
    rows = [['কেনা দাম', `${tk(r.purchase)} (${monTxt(r.kg)} × ${tk(r.price, 1)})`],
      [`ট্রাক ভাড়া${r.transport_mode === 'reroute' ? ', আপনার ভাগ' : ' (নিজের ট্রাক, আনুমানিক)'}`, '−' + tk(r.transport), 'minus'],
      [`${esc(r.resale_name)}-এ সম্ভাব্য বিক্রি (${tk(r.resale_price, 1)}/কেজি)`, tk(r.gross)],
      [`পচন ও ওজন কমা (${nf(r.spoil_pct, 1)}%)`, '−' + tk(r.spoil_tk), 'minus'],
      [`বাজার কমিশন (${nf(r.commission_pct)}%)`, '−' + tk(r.commission), 'minus'],
      ['আনুমানিক ফল', '−' + tk(loss), 'tot']];
    if (r.price > r.breakeven) reasons.push(`কেনার দাম ${tk(r.price, 1)}/কেজি, লাভের সীমা ${tk(r.breakeven, 1)}/কেজির বেশি`);
    if (r.transport > r.gross * 0.1) reasons.push('ট্রাক ভাড়া বিক্রির তুলনায় বেশি');
    if (r.spoil_pct >= 5) reasons.push('পথে পচনের ঝুঁকি বেশি');
    tips.push(`${tk(r.breakeven, 1)}/কেজি বা কম দামে কিনলে লোকসান হবে না (৮% লাভ রাখতে ${tk(r.target, 1)}/কেজি)।`);

async function advDownload(fmt, source){
  try {
    const r = await fetch(`/api/ai/advisor/admin/export?fmt=${fmt}&source=${source}`, {headers: TOKEN ? {'X-Token': TOKEN} : {}});
    if (!r.ok) { toast('Export হয়নি, আবার চেষ্টা করুন','error'); return; }
    const blob = await r.blob(), cd = r.headers.get('Content-Disposition') || '', m = cd.match(/filename="([^"]+)"/);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = m ? m[1] : `reroute-transactions.${fmt}`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('ডাউনলোড শুরু হয়েছে','info');
  } catch (e) {
    toast('Export হয়নি, আবার চেষ্টা করুন','error');
  }
}

/* ---------- small cached GET for these pages (re-renders while the same page is open) ---------- */
const FX = {cache: {}, busy: {}};
function fxGet(path, ttl = 120000){
  const c = FX.cache[path], here = location.hash;
  if (c && !c.error && Date.now() - c.at < ttl) return c.d;
  if (!FX.busy[path]) {
    FX.busy[path] = 1;
    fetch('/api' + path, {headers: TOKEN ? {'X-Token': TOKEN} : {}})
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { FX.cache[path] = {d, at: Date.now()}; })
      .catch(() => { FX.cache[path] = {error: true, at: Date.now()}; })
      .finally(() => { delete FX.busy[path]; if (location.hash === here) render(); });
  }
  return c && !c.error ? c.d : null;
}
const fxFailed = path => !!(FX.cache[path] && FX.cache[path].error);
const fxDrop = prefix => Object.keys(FX.cache).filter(k => k.startsWith(prefix)).forEach(k => delete FX.cache[k]);

let VA_REC = null;
function vaListen(){
  if (VA.listening && VA_REC) { VA_REC.stop(); return; }
  try {
    VA_REC = new SpeechRec();
    VA_REC.lang = 'bn-BD';
    VA_REC.interimResults = false;
    VA_REC.maxAlternatives = 1;
    VA_REC.onresult = e => { VA.text = e.results[0][0].transcript; VA.parsed = null; VA.err = ''; };
    VA_REC.onerror = e => {
      VA.err = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'মাইক্রোফোনের অনুমতি দেওয়া হয়নি। ব্রাউজারে অনুমতি দিন বা লিখে জিজ্ঞেস করুন।'
        : e.error === 'no-speech' ? 'কোনো কথা শোনা যায়নি। আবার বলুন বা লিখুন।' : 'কণ্ঠস্বর চেনা যায়নি। লিখে জিজ্ঞেস করুন।';
    };
    VA_REC.onend = () => { VA.listening = false; render(); };
    VA.listening = true; VA.err = '';
    VA_REC.start();
    render();
  } catch (e) { VA.listening = false; VA.err = 'কণ্ঠস্বর চেনা চালু করা যায়নি। লিখে জিজ্ঞেস করুন।'; render(); }
}
async function vaParse(){
  const inp = $('#va-in');
  VA.text = (inp ? inp.value : VA.text).trim();
  if (!VA.text) { VA.err = 'প্রশ্নটি লিখুন বা বলুন'; render(); return; }
  VA.busy = true; VA.err = ''; render();
  try { VA.parsed = await api('/ai/advisor/parse', 'POST', {text: VA.text}); }
  catch (e) { VA.err = e.message || 'বোঝা যায়নি'; }
  VA.busy = false; render();
}
function vaGo(){
  const p = VA.parsed;
  if (!p || p.missing.length) return;
  ADV.crop = p.crop; ADV.days = ''; ADV.costTouched = false; advPrefillCost();
  ADV.mon = Math.min(2500, Math.max(1, Math.round(p.qty_kg / MON)));
  if (p.place) ADV.place = p.place;
  render();
  setTimeout(() => { const el = $('.ss-panel'); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 50);
}

/* =====================================================================
   Negotiation timeline on the offer page (only stages the app supports; the order page has its own steps)
   ===================================================================== */
function dealTimeline(o, order){
  const ev = (S.offer_events || []).filter(e => e.offer === o.id);
  const insp = (S.inspections || []).filter(i => i.listing === o.listing && i.buyer === o.buyer).sort((a, b) => b.created - a.created)[0];
  const ended = ['rejected', 'cancelled', 'expired'].includes(o.status) ? o.status : order && order.status === 'cancelled' ? 'cancelled' : null;
  const steps = [];
  if (insp) steps.push(['পরিদর্শন', insp.status === 'completed' ? 'done' : 'skip']);
  steps.push(['অফার', 'done']);
  if (ev.some(e => e.action === 'counter')) steps.push(['পাল্টা দাম', 'done']);
  steps.push(['রাজি', o.status === 'accepted' ? 'done' : 'todo']);
  steps.push(['পেমেন্ট', order && order.paid_at ? 'done' : 'todo']);
  steps.push([order && order.transport === 'reroute' ? 'পরিবহন ও হস্তান্তর' : 'হস্তান্তর', order && order.handover_at ? 'done' : 'todo']);
  steps.push(['সম্পন্ন', order && order.status === 'completed' ? 'done' : 'todo']);
  const cur = steps.findIndex(s => s[1] === 'todo');
  return `<ol class="tl" aria-label="লেনদেনের ধাপ">${steps.filter(s => s[1] !== 'skip').map(([t, st], i, arr) => {
    const isCur = !ended && arr.findIndex(s => s[1] === 'todo') === i;
    return `<li class="${st === 'done' ? 'done' : isCur ? 'cur' : ''}" ${isCur ? 'aria-current="step"' : ''}><span class="dot">${st === 'done' ? ic('check') : bd(i + 1)}</span><span>${t}</span></li>`;
  }).join('')}${ended ? `<li class="end"><span class="dot">${ic('x')}</span><span>${{rejected: 'প্রত্যাখ্যাত', cancelled: 'বাতিল', expired: 'মেয়াদ শেষ'}[ended]}</span></li>` : ''}</ol>`;
}
const __vOffer = V.offer;
V.offer = id => {
  const html = __vOffer(id), o = (S.offers || []).find(x => x.id === id);
  if (!o) return html;
  const order = (S.orders || []).find(x => x.offer === o.id);
  return html.replace('</p>', `</p>${dealTimeline(o, order)}`);
};

  if (k === 'pool-refresh') { fxDrop('/admin/pool'); render(); }

  if (k === 'va-mic') vaListen();

/* authorised download of a PDF / CSV, then save it */
async function hbDownload(path, name){
  try{
    const r = await fetch('/api' + path, {headers: TOKEN ? {'X-Token': TOKEN} : {}});
    if (!r.ok) throw new Error(r.status);
    const blob = await r.blob(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return blob;
  } catch (e) { toast('ফাইল নামানো যায়নি, আবার চেষ্টা করুন', 'error'); return null; }
}

      <label class="q"><span>বিবরণ (ঐচ্ছিক)</span><input data-hbx="description" maxlength="200" value="${esc(f.description)}"></label>
      ${isPay ? '' : `<label><span>রসিদের ছবি/PDF (ঐচ্ছিক)</span><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" data-hbfile="1">${f.document_id ? '<span class="good xs">ফাইল যুক্ত হয়েছে</span>' : ''}</label>`}
    </div>
    ${HB.err ? `<p class="form-error" role="alert">${esc(HB.err)}</p>` : ''}
    <div class="row wrap-it" style="gap:8px;margin-top:12px"><button class="btn btn-green" data-hb="save" ${HB.busy ? 'disabled' : ''}>${HB.busy ? 'সংরক্ষণ হচ্ছে...' : 'সংরক্ষণ করুন'}</button>

  <section class="panel" aria-labelledby="hb-dues"><h3 id="hb-dues">${ic('wallet')} পাওনা ও দেনা</h3>
    ${!dues ? advLoading() : `<div class="grid2 tight" style="margin-bottom:10px"><div class="kpi"><span class="muted sm">মোট পাওনা (বাকি)</span><strong>${tk(dues.summary.receivable)}</strong></div>
      <div class="kpi"><span class="muted sm">মোট দেনা (বাকি)</span><strong>${tk(dues.summary.payable)}</strong></div></div>

      <div class="filters hb-form" style="margin-top:10px">
        <label><span>ধরন</span><select id="due-dir"><option value="receivable">পাওনা (আমি পাব)</option><option value="payable">দেনা (আমি দেব)</option></select></label>

        <label><span>শেষ তারিখ (ঐচ্ছিক)</span><input id="due-date" type="date"></label>
        <label class="q"><span>বিবরণ (ঐচ্ছিক)</span><input id="due-desc" maxlength="200"></label></div>
      <button class="btn btn-green btn-sm" style="margin-top:10px" data-hb="due-add">যোগ করুন</button></details></section>

  <section class="panel"><h3>${ic('book')} লেখা হিসাব</h3>
    ${!rec ? advLoading() : rec.length ? rec.map(e => `<div class="hb-row ${e.voided ? 'voided' : ''}"><span class="grow"><b>${esc(e.type_bn)}</b>
      <span class="muted xs">${esc(e.date)}${e.crop ? ' · ' + (CROPS[e.crop] ? CROPS[e.crop].n : esc(e.crop)) : ''}${e.qty_kg ? ' · ' + nf(e.qty_kg) + ' কেজি' : ''}${e.counterparty ? ' · ' + esc(e.counterparty) : ''}${e.description ? ' · ' + esc(e.description) : ''} · ${esc(e.source_bn)}${e.voided ? ' · বাতিল: ' + esc(e.void_reason || '') : ''}</span></span>
      <span class="hb-amt ${e.type === 'sale_external' ? 'pos' : ''}">${tk(e.amount)}</span>
      ${e.document_id ? `<button class="iconbtn" data-hb="doc" data-id="${e.document_id}" aria-label="সংযুক্ত রসিদ দেখুন">${ic('receipt')}</button>` : ''}
      ${e.voided ? '' : `<button class="iconbtn" data-hb="void" data-id="${e.id}" aria-label="এই হিসাব বাতিল করুন">${ic('x')}</button>`}</div>`).join('')
      : '<p class="muted sm">এখনো নিজে কোনো হিসাব লেখেননি।</p>'}</section>`;
}
function hbDueRow(d){
  const plat = d.source === 'platform';
  return `<div class="hb-row"><span class="grow"><b>${d.direction === 'receivable' ? 'পাওনা' : 'দেনা'}: ${esc(d.counterparty)}</b>
      <span class="muted xs">${esc(d.description || '')}${d.due_date ? ' · শেষ তারিখ ' + esc(d.due_date) : ''}${plat ? ' · প্ল্যাটফর্ম' : ' · নিজে লেখা'}${d.payments && d.payments.length ? ` · ${nf(d.payments.length)}বার টাকা লেনদেন` : ''}</span></span>
    <span class="hb-amt">${tk(d.outstanding)}${!plat && d.paid ? `<span class="muted xs"> / ${tk(d.amount)}</span>` : ''}</span>${hbPill(d.status, d.status_bn)}
    ${plat ? `<a class="iconbtn" href="${d.link}" aria-label="অর্ডার দেখুন">${ic('next')}</a>`
      : d.outstanding > 0 ? `<button class="btn btn-line btn-sm" data-hb="due-pay" data-id="${d.id}" data-dir="${d.direction}" data-out="${d.outstanding}">টাকা লিখুন</button>` : ''}</div>`;
}

function hbReports(){
  if (hbNeedRange()) return hbPeriodPicker() + `<p class="muted sm" style="margin-top:10px">শুরু ও শেষের তারিখ বাছুন।</p>`;
  const q = `${hbRange()}&group=${HB.group}`, path = `/hisab/report?${q}`, r = fxGet(path, 30000);
  const head = hbPeriodPicker() + `<div class="row wrap-it" style="gap:8px;margin:10px 0">
      <div class="chips" role="group" aria-label="রিপোর্টের ভাগ">${[['day', 'দৈনিক'], ['week', 'সাপ্তাহিক'], ['month', 'মাসিক']].map(([k, t]) => `<button class="chip ${HB.group === k ? 'on' : ''}" data-hb="group" data-v="${k}">${t}</button>`).join('')}</div>
      <button class="btn btn-line btn-sm" data-hb="rep-csv">${ic('download')} CSV</button><button class="btn btn-green btn-sm" data-hb="rep-pdf">${ic('download')} PDF</button></div>`;
  if (!r) return head + (fxFailed(path) ? fxErr() : advLoading());
  const p = r.pnl;
  return head + `<div class="grid2" style="align-items:start">
    <section class="panel"><h3>সময় অনুযায়ী বিক্রি</h3>${r.sales.length ? `<div class="scroll"><table class="tbl"><tr><th>সময়</th><th class="num">লেনদেন</th><th class="num">কেজি</th><th class="num">বিক্রি</th></tr>
      ${r.sales.map(x => `<tr><td>${esc(x.period)}</td><td class="num">${nf(x.count)}</td><td class="num">${nf(x.kg)}</td><td class="num b">${tk(x.revenue)}</td></tr>`).join('')}</table></div>` : '<p class="muted sm">এই সময়ে বিক্রি নেই।</p>'}</section>
    <section class="panel"><h3>পণ্য অনুযায়ী</h3>${r.products.length ? `<div class="scroll"><table class="tbl"><tr><th>ফসল</th><th class="num">কেজি</th><th class="num">গড় দাম</th><th class="num">বিক্রি</th></tr>
      ${r.products.map(x => `<tr><td>${CROPS[x.crop] ? CROPS[x.crop].n : esc(x.crop_bn)}</td><td class="num">${nf(x.kg)}</td><td class="num">${x.avg_price != null ? tk(x.avg_price, 1) : '—'}</td><td class="num b">${tk(x.revenue)}</td></tr>`).join('')}</table></div>` : '<p class="muted sm">এই সময়ে বিক্রি নেই।</p>'}</section>
    <section class="panel"><h3>খরচের খাত</h3>${r.expenses.length ? `<div class="scroll"><table class="tbl"><tr><th>খাত</th><th class="num">প্ল্যাটফর্ম</th><th class="num">নিজে লেখা</th><th class="num">মোট</th></tr>
      ${r.expenses.map(x => `<tr><td>${esc(x.label)}</td><td class="num">${tk(x.platform)}</td><td class="num">${tk(x.user_reported)}</td><td class="num b">${tk(x.amount)}</td></tr>`).join('')}</table></div>` : '<p class="muted sm">এই সময়ে খরচ নেই।</p>'}</section>
    <section class="panel"><h3>লাভ-ক্ষতি ও বাকি</h3>${bill([['বিক্রি', tk(p.revenue)], ['মালের খরচ', '−' + tk(p.cost_of_goods), 'minus'], ['খরচ', '−' + tk(p.total_expenses), 'minus'],
      ['লাভ / ক্ষতি', p.profit_complete ? (p.profit < 0 ? '−' : '') + tk(Math.abs(p.profit)) : 'হিসাব সম্পূর্ণ নয়', 'tot']])}
      ${p.profit_complete ? '' : `<p class="warn sm" style="margin-top:6px">${PROFIT_MISSING_BN()}</p>`}
      ${bill([['মোট পাওনা (বাকি)', tk(r.dues.receivable)], ['মোট দেনা (বাকি)', tk(r.dues.payable)], ['মেয়াদ পেরোনো', nf(r.dues.overdue)]])}
      <p class="muted xs" style="margin-top:6px">${esc(r.note)}</p></section></div>`;
}

V.hisab = (tab, id) => {
  const head = `<div class="phead no-print"><div><h1>${ic('receipt')} স্মার্ট হিসাব</h1><p class="muted">বিক্রি, খরচ, বিল, রসিদ, পাওনা-দেনা আর লাভ-ক্ষতি এক জায়গায়</p></div></div>`;
  if (tab === 'invoice') return hbInvoice(id);
  const t = ['bills', 'entries', 'reports'].includes(tab) ? tab : '';

};

/* =====================================================================
   Floating Bangla assistant (farmer / paikar pages)
   ===================================================================== */
const AS = {open: false, busy: false, listening: false, msgs: [], speak: false};
function asEnsure(){
  if (document.getElementById('as-fab')) return;
  const fab = document.createElement('button');
  fab.id = 'as-fab'; fab.className = 'as-fab'; fab.type = 'button';
  fab.setAttribute('aria-label', 'বাংলা সহকারী খুলুন'); fab.setAttribute('aria-controls', 'as-panel'); fab.setAttribute('aria-expanded', 'false');
  fab.innerHTML = ic('mic');
  fab.addEventListener('click', () => { AS.open = !AS.open; asDraw(); if (AS.open) setTimeout(() => { const i = $('#as-in'); if (i) i.focus(); }, 30); });
  const panel = document.createElement('section');
  panel.id = 'as-panel'; panel.className = 'as-panel'; panel.hidden = true;
  panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', 'বাংলা সহকারী');
  document.body.append(fab, panel);
}
function asDraw(){
  asEnsure();
  const u = me(), show = !!u && (u.role === 'farmer' || u.role === 'paikar');
  const fab = $('#as-fab'), panel = $('#as-panel');
  fab.hidden = !show;
  if (!show) { panel.hidden = true; return; }
  fab.setAttribute('aria-expanded', String(AS.open));
  fab.classList.toggle('on', AS.open);
  panel.hidden = !AS.open;
  if (!AS.open) return;
  panel.innerHTML = `<header class="as-head"><b>${ic('mic')} বাংলা সহকারী</b>
      <button class="iconbtn" data-as="close" aria-label="সহকারী বন্ধ করুন">${ic('x')}</button></header>
    <div class="as-msgs" aria-live="polite" data-i18n-skip>${AS.msgs.length ? AS.msgs.map(m => m.me
      ? `<p class="as-me">${esc(m.text)}</p>`
      : `<div class="as-bot"><p>${esc(m.text)}</p>${m.items && m.items.length ? `<ul>${m.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
          ${m.links && m.links.length ? `<p class="as-links">${m.links.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join(' · ')}</p>` : ''}
          ${m.simulated ? '<span class="demo-tag">সিমুলেটেড বাজারদর</span>' : ''}
          ${'speechSynthesis' in window ? `<button class="linkbtn xs" data-as="say" data-i="${AS.msgs.indexOf(m)}">${ic('volume')} শুনুন</button>` : ''}</div>`).join('')
      : `<div class="as-bot"><p>আপনার হিসাব বা বাজার নিয়ে জিজ্ঞেস করুন, যেমন:</p><ul>${['আমার এই মাসে কত টাকার বিক্রি হয়েছে?', 'আমার কত টাকা পাওনা আছে?', 'আমার শেষ তিনটা বিল দেখাও', 'আজ আলুর বাজারদর কত?'].map(q => `<li><button class="linkbtn" data-as="ex">${q}</button></li>`).join('')}</ul></div>`}
      ${AS.busy ? `<p class="as-bot muted">${'ভাবছি...'}</p>` : ''}</div>
    <div class="as-input">
      <label class="sr-only" for="as-in">প্রশ্ন লিখুন বা বলুন</label>
      <input id="as-in" maxlength="300" placeholder="প্রশ্ন লিখুন বা মাইকে বলুন">

async function asSend(text){
  text = (text || '').trim();
  if (!text || AS.busy) return;
  AS.msgs.push({me: true, text}); AS.busy = true; asDraw();
  try { AS.msgs.push(await api('/assistant/ask', 'POST', {text}, {quiet: true})); }
  catch (e) { AS.msgs.push({text: e.status === 401 ? 'আবার লগ ইন করুন।' : e.name === 'AbortError' || !e.status ? 'সার্ভারের সাথে যোগাযোগ হচ্ছে না। ইন্টারনেট দেখে আবার চেষ্টা করুন।' : (e.message || 'উত্তর পাওয়া যায়নি')}); }
  AS.busy = false;
  if (AS.msgs.length > 30) AS.msgs = AS.msgs.slice(-30);

}

    AS_REC.onend = () => { AS.listening = false; const v = ($('#as-in') || {}).value; asDraw(); const i = $('#as-in'); if (i && v) i.value = v; };

function hbAsk(title, body, mode){
  return new Promise(res => {
    modal(`<div class="body"><h2>${esc(title)}</h2><p class="muted sm" style="margin-top:6px">${esc(body)}</p>

    applyLanguage($('#modal'));
    const inp = $('#hb-ask'); inp.focus();
    const done = v => { closeModal(); res(v); };
    $('#hb-ask-ok').addEventListener('click', () => { const v = inp.value.trim(); if (v) done(v); });
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); const v = inp.value.trim(); if (v) done(v); } });
    const m = $('#modal'), obs = new MutationObserver(() => { if (!m.classList.contains('on')) { obs.disconnect(); res(null); } });
    obs.observe(m, {attributes: true, attributeFilter: ['class']});
  });
}

   Keep focus after render
   ===================================================================== */

function renderKeepFocus(){
  const a=document.activeElement;

  const key=a&&[...a.attributes]
    .find(
      x=>
        x.name.startsWith('data-')
        &&
        x.name!=='data-act'
        &&
        x.name!=='data-num'
    );

  const isText=
    !!a
    &&
    a.tagName==='INPUT'
    &&
    a.type==='text';

  const isNum=
    !!a
    &&
    !!a.dataset.num;

  const raw=isText?a.value:null;
  const s1=isText?a.selectionStart:null;
  const s2=isText?a.selectionEnd:null;

  render();

  if(key){
    const el=document.querySelector(
      `[${key.name}="${key.value}"]`
    );

    if(el){
      if(
        isText
        &&
        el.tagName==='INPUT'
        &&
        el.type==='text'
      ){
        el.value=raw;
      }

      el.focus();

      try{
        if(isNum){
          const end=el.value.length;
          el.setSelectionRange(end,end);
        }
        else{
          el.setSelectionRange(
            s1==null?el.value.length:s1,
            s2==null?el.value.length:s2
          );
        }
      }
      catch(e){}
    }
  }
}


/* =====================================================================
   Numeric input validation
   ===================================================================== */

(function(){
  const BNDIG='০১২৩৪৫৬৭৮৯';

  const clean=(s,dec)=>{
    s=String(s)
      .replace(/[০-৯]/g,d=>BNDIG.indexOf(d))
      .replace(/[।．]/g,'.');

    if(!dec){
      return s.replace(/[^0-9]/g,'');
    }

    s=s.replace(/[^0-9.]/g,'');

    const i=s.indexOf('.');

    return i<0
      ? s
      : s.slice(0,i+1)
        +
        s.slice(i+1).replace(/\./g,'');
  };

  window.cleanNumberText=clean;

  document.addEventListener(
    'beforeinput',
    e=>{
      const t=e.target;

      if(
        !t
        ||
        !t.dataset
        ||
        !t.dataset.num
        ||
        e.isComposing
      ){
        return;
      }

      if(
        e.data
        &&
        /[-+eE]/.test(e.data)
      ){
        e.preventDefault();
      }
    },
    true
  );

  document.addEventListener(
    'keydown',
    e=>{
      const t=e.target;

      if(
        !t
        ||
        !t.dataset
        ||
        !t.dataset.num
      ){
        return;
      }

      if(
        ['-','+','e','E'].includes(e.key)
      ){
        e.preventDefault();
      }
    },
    true
  );

  document.addEventListener(
    'input',
    e=>{
      const t=e.target;

      if(
        !t
        ||
        !t.dataset
        ||
        !t.dataset.num
        ||
        e.isComposing
      ){
        return;
      }

      const dec=t.dataset.num==='dec';
      const before=t.value;

      const pos=
        t.selectionStart==null
          ? before.length
          : t.selectionStart;

      const next=clean(before,dec);

      if(next===before){
        return;
      }

      const caret=
        clean(
          before.slice(0,pos),
          dec
        ).length;

      t.value=next;

      try{
        t.setSelectionRange(
          caret,
          caret
        );
      }
      catch(err){}
    },
    true
  );
})();

const bdPhone=v=>{ let d=onlyDigits(v); if(d.startsWith('00880')) d=d.slice(4); if(d.startsWith('880')&&d.length===13) d=d.slice(2); return d; };

function otpLeft(){
  const s=Math.max(0,Math.round(((OTP&&OTP.expires)||0)-Date.now())/1000|0);
  return s?`${bd(Math.floor(s/60))}:${bd(String(s%60).padStart(2,'0'))} মিনিটে মেয়াদ শেষ`:'কোডের মেয়াদ শেষ, আবার পাঠান';
}

function drawOtp(value=''){
  modal(`<div class="body otp-box">
    <div class="otp-ic">${ic('shield')}</div>
    <h2>OTP যাচাই</h2>
    <p class="muted sm">অ্যাকাউন্ট খুলতে <b data-i18n-skip>${esc(OTP.phone)}</b> নম্বরের কোডটি দিন</p>
    <div class="otp-demo">
      <div class="row" style="gap:8px">${ic('info')}<b>প্রোটোটাইপ মোড</b></div>
      <p>প্রোটোটাইপ মোড: SMS সেবা এখনো চালু করা হয়নি। আপনার ডেমো ভেরিফিকেশন কোড:</p>
      <div class="otp-code" data-i18n-skip>${esc(OTP.demo_otp)}</div>
      <p class="xs muted">এই কোড শুধু এই নিবন্ধনের জন্য, সার্ভারে যাচাই হয়। এটি ফোন নম্বরের মালিকানা প্রমাণ করে না। · <span id="otp-left">${otpLeft()}</span></p>
    </div>
    <label class="field"><span>৫ সংখ্যার কোড দিন</span>
      <input id="otp-in" class="otp-input" inputmode="numeric" maxlength="5" autocomplete="one-time-code" placeholder="_ _ _ _ _" value="${esc(value)}" ${OTP.err?'aria-invalid="true"':''}></label>
    ${OTP.err?`<p class="danger sm" role="alert" style="margin-top:10px;text-align:left">${esc(OTP.err)}</p>`:''}
    <button class="btn btn-green btn-wide" style="margin-top:16px" data-act="otp-verify">যাচাই করে অ্যাকাউন্ট খুলুন</button>
    <p class="muted sm" style="margin-top:12px">কোড পাননি? <button type="button" class="linkbtn" data-act="otp-resend">আবার পাঠান</button></p>
  </div>`);

  applyLanguage($('#modal'));
  const inp=$('#otp-in');
  if(inp) inp.focus();

  clearInterval(OTP_TIMER);
  OTP_TIMER=setInterval(()=>{
    const el=$('#otp-left');
    if(!OTP||!el){ clearInterval(OTP_TIMER); return; }
    el.textContent=otpLeft();
    applyLanguage(el);
  },1000);
}

/* keep typed sign-up / login values across re-renders */
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.rg!==undefined){
    RG[d.rg]=e.target.value;
    if(d.rg!=='password'&&d.rg!=='confirm') rgDraft();
    if(RGE[d.rg]){
      delete RGE[d.rg];
      const f=e.target.closest('.field');
      if(f){ f.classList.remove('err'); const m=f.querySelector('.ferr'); if(m) m.remove(); }
    }
  }
  if(d.lg!==undefined){
    LG[d.lg]=e.target.value;
    if(LG.err){ LG.err=''; const m=$('#lg-err'); if(m) m.remove(); document.querySelectorAll('[data-lg]').forEach(x=>{ x.removeAttribute('aria-invalid'); const f=x.closest('.field'); if(f) f.classList.remove('err'); }); }
  }
  if(d.rg!==undefined&&RGE.form){ delete RGE.form; const m=$('#rg-err'); if(m) m.remove(); }
});

/* Enter submits the login, sign-up and OTP forms */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.matches('input')) return;
  const d=e.target.dataset||{}, act=e.target.id==='otp-in'?'otp-verify':d.lg!==undefined?'login-phone':d.rg!==undefined?'register':null;
  if(!act) return;
  e.preventDefault();
  const btn=document.querySelector(`[data-act="${act}"]`);
  if(btn) btn.click();
});

  register:async()=>{
    const phone=bdPhone(RG.phone), E={};

    if(RG.name.trim().length<2) E.name='পুরো নাম দিন';
    if(!/^01\d{9}$/.test(phone)) E.phone='০১ দিয়ে শুরু ১১ সংখ্যার মোবাইল নম্বর দিন';
    if(RG.password.length<6) E.password='পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে';
    if(RG.confirm!==RG.password) E.confirm='দুটো পাসওয়ার্ড মিলছে না';
    if(RG.upazila.trim().length<2) E.upazila='উপজেলার নাম দিন';
    if(RG.market.trim().length<2) E.market='নিকটবর্তী বাজারের নাম দিন';

    RGE=E;

    if(Object.keys(E).length){
      render();
      const first=document.querySelector('.field.err input');
      if(first) first.focus();
      return;
    }

    const b={
      role:loginRole,
      name:RG.name.trim(),
      phone,
      password:RG.password,
      confirm_password:RG.confirm,
      place:RG.place,
      upazila:RG.upazila.trim(),
      market:RG.market.trim(),
      biz:loginRole==='paikar'&&RG.biz.trim()?RG.biz.trim():null
    };

    let r;
    try{
      r=await api('/register','POST',b);
    }
    catch(e){
      RGE={form:e.message||'অ্যাকাউন্ট খোলা যায়নি, আবার চেষ্টা করুন'};
      render();
      return;
    }

    OTP={...r, phone, expires:Date.now()+r.expires_in*1000, err:''};
    drawOtp();
  },

  'otp-verify':async()=>{
    const inp=$('#otp-in'), code=onlyDigits(inp?inp.value:'');

    if(code.length!==5){
      OTP.err='৫ সংখ্যার কোডটি দিন';
      drawOtp(code);
      return;
    }

    let r;
    try{
      r=await api('/register/verify','POST',{reg_id:OTP.reg_id, otp:code});
    }
    catch(e){
      OTP.err=e.message||'কোড মেলেনি';
      drawOtp(code);
      return;
    }

    OTP=null;
    RG={name:'',biz:'',phone:'',password:'',confirm:'',place:'rajshahi',upazila:'',market:''};
    rgDraft(true);
    closeModal();
    setToken(r.token);
    await load();
    go('#/home');
    toast('অ্যাকাউন্ট খোলা হয়েছে');

  'of-submit':async()=>{
    const c=offerCalc(),
          l=c.l;

    if(
      c.kg<l.moq
      ||
      c.kg>l.available
    ){
      toast(
        `পরিমাণ ${monTxt(l.moq)} থেকে ${monTxt(l.available)} এর মধ্যে দিন`,'error'
      );

      return;
    }

    if(
      !(
        OF.price>0
        &&
        OF.price<=l.eff_price
      )
    ){
      toast(
        `দাম তালিকার দাম ${tk(l.eff_price,1)} বা কম দিন`,'error'
      );

      return;
    }

    const ok=
      await confirmBox({
        title:'অফার পাঠাবেন?',

        body:
          `<p>${monTxt(c.kg)} ${CROPS[l.crop].n}, ${tk(OF.price,1)}/কেজি</p>`
          +
          offerBill(c)
          +
          '<p class="muted sm" style="margin-top:8px">বিক্রেতা রাজি হলে পেমেন্ট করতে বলা হবে। এখন কোনো টাকা কাটবে না।</p>',

        ok:'অফার পাঠান'
      });

    if(!ok){
      return;
    }

    const o=
      await api(
        '/offers',
        'POST',
        {
          listing:l.id,
          qty:c.kg,
          price:+OF.price,
          transport:OF.transport,
          split:OF.split,
          note:OF.note
        }
      );

    await load();

    go(
      '#/offer/'+o.id

    toast(
      'অফার পাঠানো হয়েছে'
    );

        sellerPayout(

        !await confirmBox({
          title:'এই দামে বিক্রি করবেন?',

          body:
            `<p>${monTxt(o.qty)} ${CROPS[o.crop].n}, ${tk(o.price,1)}/কেজি, ${esc(dispName(user(o.buyer)))}-কে</p>`

            bill([

                tk(e.goods)
              ],

                'প্ল্যাটফর্ম ফি ১%',
                '−'+tk(
                  e.fee-e.feeDisc

                'minus'

              e.share

                tk(e.payout),
                'tot'
              ]

            +
            '<p class="muted sm" style="margin-top:8px">রাজি হলে মাল সংরক্ষিত হবে। ক্রেতা পেমেন্ট করলে অর্ডার নিশ্চিত, টাকা Reroute-এ জমা থাকবে, মাল বুঝে দিলে পাবেন।</p>',

          ok:'হ্যাঁ, রাজি'
        })
      ){
        return;
      }

      const r=
        await api(
          `/offers/${d.id}/accept`,
          'POST',
          {}
        );

      await load();

      go(
        '#/order/'+r.order.id
      );

      toast(
        'রাজি হয়েছেন, ক্রেতার পেমেন্টের অপেক্ষা'
      );
    }
    else{
      const e=
        buyerTotal(
          o,
          o.price
        );

      if(
        !await confirmBox({
          title:'পাল্টা দামে কিনবেন?',

          body:
            `<p>${monTxt(o.qty)} ${CROPS[o.crop].n}, ${tk(o.price,1)}/কেজি</p>`
            +
            bill([
              [
                'মালের দাম',
                tk(e.goods)
              ],

              e.share
                ? [
                    'ট্রাক ভাড়া, আপনার ভাগ',
                    tk(e.share)
                  ]
                : null,

              e.credit
                ? [
                    'ছাড়',
                    '−'+tk(e.credit),
                    'plus'
                  ]
                : null,

              [
                'মোট পেমেন্ট',
                tk(e.total),
                'tot'

        return;

      const r=
        await api(

      /

      `<div class="body">

          ${ic('↔️')} পাল্টা দাম দিন
        </h2>

        <p class="muted">

          style="margin-top:6px"
        >

      </div>`
    );

  'pay-method':async d=>{
    PAY.method=d.v;

    const p=
      await api(
        '/payments',
        'POST',
        {
          purpose:PAY.purpose,
          ref:PAY.ref,
          method:d.v
        }
      );

    PAY.pid=p.id;

    if(p.status==='success'){
      PAY.step='done';
      PAY.txn=p.txn;
    }
    else if(p.status==='failed'){
      PAY.step='failed';
      PAY.msg=p.message;
    }
    else{
      PAY.step='gateway';
    }

    drawPay();
  },

  'pay-back':()=>{
    PAY.step='method';
    drawPay();
  },

  'pay-confirm':async()=>{
    const acc=
      ($('#pay-acc').value||'')
        .replace(/\s/g,'');

    const pin=
      $('#pay-pin').value.trim();

    const r=
      await api(
        `/payments/${PAY.pid}/confirm`,
        'POST',
        {
          account:acc,
          pin
        }
      );

    if(r.status==='success'){
      PAY.step='done';
      PAY.txn=r.txn;
    }
    else{
      PAY.step='failed';
      PAY.msg=r.message;
    }

    drawPay();
  },

  'pay-retry':()=>{
    PAY.step='method';
    drawPay();
  },

  'pay-finish':async()=>{
    const after=PAY.after;

    closeModal();

    await refresh();

    toast(
      'পেমেন্ট সফল'
    );

    if(after){
      after();
    }
  },

  'bk-submit':async()=>{
    const {
      kg,
      q,
      credit,
      pay
    }=bkQuote();

    if(
      BK.src===BK.dst
      &&
      !BK.srcAddr
    ){
      toast(
        'ঠিকানা দিন','error'
      );

      return;
    }

    if(kg<100){
      toast(
        'অন্তত ৩ মণ দিন','error'
      );

      return;
    }

    if(
      !await confirmBox({
        title:'ট্রাক বুক করবেন?',

        body:
          `<p>${PLACES[BK.src].n} → ${PLACES[BK.dst].n}, ${monTxt(kg)} ${CROPS[BK.crop].n}, ${BK.date}</p>`
          +
          bill([
            [
              q.vehicle_name,
              tk(q.fare)
            ],
            [
              'সেবা চার্জ',
              tk(q.service)
            ],
            credit
              ? [
                  'ছাড়',
                  '−'+tk(credit),
                  'plus'
                ]
              : null,
            [
              'মোট',
              tk(pay),
              'tot'
            ]
          ])
          +
          '<p class="muted sm" style="margin-top:8px">পেমেন্ট হলে বুকিং অনুরোধ অপারেশন টিমের কাছে যাবে, ট্রাক ঠিক হলে জানানো হবে।</p>',

        ok:'পেমেন্টে যান'
      })
    ){
      return;
    }

    const b=
      await api(
        '/bookings',
        'POST',
        {
          pickup_place:BK.src,
          pickup_addr:BK.srcAddr,
          drop_place:BK.dst,
          drop_addr:BK.dstAddr,
          crop:BK.crop,
          qty:kg,
          date:BK.date
        }
      );

    await load();

    go(
      '#/booking/'+b.id,
      ()=>
        payFlow(
          'booking',
          b.id,
          b.total-b.credit_used,
          `Reroute ট্রাক: ${PLACES[b.pickup_place].n} → ${PLACES[b.drop_place].n}`,
          null
        )
    );

  /* =====================================================
     Transport Cost Negotiation
     ===================================================== */

  // Open transport proposal modal
  'tn-propose':d=>{
    const oid=d.oid;
    const o=(S.orders||[]).find(x=>x.id===oid);
    const tn=(S.transport_negotiations||{})[oid];
    const tTotal=tn?tn.t_total:(o?o.t_total:0);
    const isBuyer=o&&o.buyer===me().id;
    modal(`<div class="body">
      <h2>${ic('🚚')} পরিবহন খরচের প্রস্তাব</h2>
      <p class="muted" style="margin-top:6px">মোট ট্রাক ভাড়া: <b>${tk(tTotal)}</b></p>
      <p class="muted sm" style="margin-top:4px">ক্রেতা ও বিক্রেতার শতাংশের যোগফল ১০০ হতে হবে।</p>
      <div class="grid2" style="gap:10px;margin-top:12px">
        <label class="field"><span>ক্রেতার ভাগ (%)</span>
          <input id="tn-buyer-pct" type="number" min="0" max="100" step="1" value="${isBuyer?100:50}">
        </label>
        <label class="field"><span>বিক্রেতার ভাগ (%)</span>
          <input id="tn-seller-pct" type="number" min="0" max="100" step="1" value="${isBuyer?0:50}">
        </label>
      </div>
      <div id="tn-preview" class="bill" style="margin-top:10px"></div>
      <label class="field" style="margin-top:10px"><span>নোট (ঐচ্ছিক)</span>
        <input id="tn-note" placeholder="কারণ বা মন্তব্য">
      </label>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-soft grow" data-act="close">বাতিল</button>
        <button class="btn btn-green grow" data-act="tn-propose-send" data-oid="${oid}" data-total="${tTotal}">প্রস্তাব পাঠান</button>
      </div>
    </div>`);
    // live preview
    function updatePreview(){
      const bp=+($('#tn-buyer-pct')?.value||0);
      const sp=+($('#tn-seller-pct')?.value||0);
      const el=$('#tn-preview');
      if(el) el.innerHTML=`<div><span>ক্রেতার ভাগ</span><b>${tk(Math.round(tTotal*bp/100))} (${nf(bp,1)}%)</b></div><div><span>বিক্রেতার ভাগ</span><b>${tk(Math.round(tTotal*sp/100))} (${nf(sp,1)}%)</b></div>`;
    }
    setTimeout(()=>{
      $('#tn-buyer-pct')?.addEventListener('input',()=>{
        const bp=+($('#tn-buyer-pct').value||0);
        const sp=100-bp;
        if($('#tn-seller-pct')) $('#tn-seller-pct').value=sp;
        updatePreview();
      });
      $('#tn-seller-pct')?.addEventListener('input',()=>{
        const sp=+($('#tn-seller-pct').value||0);
        const bp=100-sp;
        if($('#tn-buyer-pct')) $('#tn-buyer-pct').value=bp;
        updatePreview();
      });
      updatePreview();
    },50);
  },

  'tn-propose-send':async d=>{
    const bp=+($('#tn-buyer-pct')?.value||0);
    const sp=+($('#tn-seller-pct')?.value||0);
    const note=($('#tn-note')?.value||'').trim();
    if(Math.abs(bp+sp-100)>0.01){
      toast('ক্রেতা ও বিক্রেতার শতাংশের যোগফল ১০০ হতে হবে','error');
      return;
    }
    if(bp<0||sp<0||bp>100||sp>100){
      toast('শতাংশ ০ থেকে ১০০-এর মধ্যে হতে হবে','error');
      return;
    }
    await api(`/orders/${d.oid}/transport/propose`,'POST',{buyer_pct:bp,seller_pct:sp,note});
    closeModal();
    await refresh();
    toast('পরিবহন খরচের প্রস্তাব পাঠানো হয়েছে');
  },

  },

  'tn-reject':async d=>{
    const oid=d.oid, pid=d.pid;
    const r=await confirmBox({
      title:'পরিবহন প্রস্তাব প্রত্যাখ্যান করবেন?',
      body:'অন্যপক্ষকে জানানো হবে। নতুন প্রস্তাব দেওয়ার সুযোগ থাকবে।',
      reason:true,
      chips:['ভাগ ঠিক নেই','অন্য প্রস্তাব দিন'],
      ok:'প্রত্যাখ্যান করুন',
      danger:true
    });
    if(!r) return;
    await api(`/orders/${oid}/transport/proposals/${pid}/respond`,'POST',{action:'reject',note:r.reason||''});
    await refresh();
    toast('পরিবহন প্রস্তাব প্রত্যাখ্যান করা হয়েছে','info');
  },

  'tn-counter':d=>{
    // Open proposal modal (same as propose)
    A['tn-propose'](d);
  }

};

/* =====================================================================
   Events
   ===================================================================== */

document.addEventListener(
  'click',
  e=>{
    const el=
      e.target.closest(
        '[data-act]'
      );

    if(!el){
      if(
        !e.target.closest('#npanel')
        &&
        !e.target.closest(
          '[data-act="bell"]'
        )
      ){
        $('#npanel')
          .classList
          .remove('on');
      }

      if(
        e.target.id==='overlay'
      ){
        closeModal();
      }

      if(
        !e.target.closest('#sheet')
      ){
        closeSheet();
      }

      return;
    }

    const fn=
      A[el.dataset.act];

    if(!fn){
      return;
    }

    e.preventDefault();

    if(
      el.dataset.busy
    ){
      return;
    }

    el.dataset.busy='1';

    Promise
      .resolve(
        fn(
          el.dataset,
          el
        )
      )
      .catch(()=>{})
      .finally(()=>{
        delete el.dataset.busy;
      });
  }
);


document.addEventListener(
  'input',
  e=>{
    const t=e.target,
          d=t.dataset,
          v=
            t.type==='checkbox'
              ? t.checked
              : t.value,
          num=
            x=>
              x===''
                ? ''
                : +x;

    if(d.f!==undefined){
      F[d.f]=v;
      renderKeepFocus();
      return;
    }

    if(d.nl!==undefined){
      NL[d.nl]=
        ['mon','price','moq','harvest']
          .includes(d.nl)
          ? num(v)
          : v;

      const s=
        $('#nl-sum');

      if(s){
        s.innerHTML=
          nlSummary();

        applyLanguage(s);
      }

      return;
    }

    if(d.of!==undefined){
      OF[d.of]=
        d.of==='note'
          ? v
          : num(v);

      const b=
        $('#of-bill');

      if(b){
        b.innerHTML=
          offerBill(
            offerCalc()
          );

        applyLanguage(b);
      }

      return;
    }

    if(d.bk!==undefined){
      BK[d.bk]=
        d.bk==='mon'
          ? num(v)
          : v;

      const b=
        $('#bk-bill');

      if(b){
        b.innerHTML=
          bkBill();

        applyLanguage(b);
      }

      return;
    }

    if(d.hf!==undefined){
      HF[d.hf]=v;
      renderKeepFocus();
      return;
    }

    if(d.cl!==undefined){
      CL[d.cl]=
        ['mon','price','other']
          .includes(d.cl)
          ? num(v)
          : v;

      const tmp=
        document.createElement('div');

      tmp.innerHTML=
        calcView();

      $('#calc-out').innerHTML=
        tmp.querySelector(
          '#calc-out'
        ).innerHTML;

      applyLanguage(
        $('#calc-out')
      );

      return;
    }

    if(d.en!==undefined){
      EN[d.en]=v;
      return;
    }

    if(d.pr!==undefined){
      const n=
        parseFloat(v);

      PR[d.pr]=
        isNaN(n)
          ? ''
          : n;

      renderKeepFocus();

      return;
    }

    if(d.ac!==undefined){
      AC[d.ac]=v;
      return;
    }

    if(d.tk!==undefined){
      TK[d.tk]=v;
      return;
    }

    if(d.ai!==undefined){
      AIS[d.ai]=v;
      render();
      return;
    }
  }
);


document.addEventListener(
  'change',
  async e=>{
    const t=e.target,
          a=t.dataset.actChange;

    if(
      t.dataset.f==='sold'
    ){
      F.sold=t.checked;
      render();
      return;
    }

    if(a==='nl-photo'){
      const picked=[...t.files], bad=picked.map(imageError).find(Boolean);
      if(bad) toast(bad,'error');
      if(picked.length>3-NL.photos.length) toast('একটি লিস্টিংয়ে ৩টির বেশি ছবি দেওয়া যায় না','warning');
      const files=
        picked
          .filter(f=>!imageError(f))
          .slice(
            0,
            3-NL.photos.length
          );
      t.value='';

      for(
        const f
        of files
      ){
        try{
          NL.photos.push(
            await shrinkImage(f)
          );
        }
        catch(err){
          toast(
            'ছবি পড়া যায়নি','error'
          );
        }
      }

      render();
    }

    if(
      a==='ac-photo'
      &&
      t.files[0]
    ){
      const bad=imageError(t.files[0]);
      if(bad){ toast(bad,'error'); t.value=''; return; }
      try{
        AC.photo=
          await shrinkImage(
            t.files[0],
            400
          );

        render();
      }
      catch(err){
        toast(
          'ছবি পড়া যায়নি','error'
        );
      }
    }
  }
);


document.addEventListener(
  'keydown',
  e=>{
    if(e.key==='Escape'){
      closeModal();

      $('#npanel')
        .classList
        .remove('on');

      closeSheet();
    }
  }
);


/* =====================================================================
   Live refresh
   ===================================================================== */

setInterval(
  async()=>{
    if(document.hidden){
      return;
    }

    try{
      const r=
        await load();

      if(!r.changed){
        return;
      }

      const a=
        document.activeElement;

      const typing=
        a
        &&
        ['INPUT','SELECT','TEXTAREA']
          .includes(a.tagName);

      const modalOpen=
        $('#overlay')
          .classList
          .contains('on');

      if(
        typing
        ||
        modalOpen
      ){
        renderChrome();
      }
      else{
        render();
      }

      if(r.fresh.length){
        toast(
          '🔔 '
          +
          r.fresh[0]
            .text
            .slice(0,80)
          +
          (
            r.fresh[0]
              .text
              .length>80
              ? '…'
              : ''
          ),'info'
        );

        const bell=
          document.querySelector(
            '[data-act="bell"]'
          );

        if(bell){
          bell.classList.add(
            'ring'
          );
        }
      }
    }
    catch(e){}
  },
  5000
);
