# Render.com blueprint: New + → Blueprint → select this repo
services:
  - type: web
    name: reroute-agro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL      # free PostgreSQL (Neon / Supabase). Empty = temporary SQLite.
        sync: false
