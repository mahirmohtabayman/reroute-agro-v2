# Render.com blueprint: New + → Blueprint → select this repo.
# If the service was created by hand (not from this blueprint), set the same environment variables in
# the Render dashboard: Service → Environment. See DEPLOYMENT_GUIDE.md.
services:
  - type: web
    name: reroute-agro
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt && python build.py

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: APP_ENV
        # production | demo. Production never seeds, resets or shows demo accounts.
        value: production

      - key: DATABASE_URL
        # Neon PostgreSQL connection string (with sslmode=require). Required: the app will not start without it.
        sync: false

      - key: SECRET_KEY
        # random value generated by Render on first deploy; never commit a real value
        generateValue: true

      - key: ENABLE_DEMO_MODE
        # true: demo accounts for judges + on-screen prototype OTP. Set "false" for a real launch.
        value: "true"

      - key: TRUSTED_PROXIES
        value: "1"
